<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Mastering Preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎚️ Audio Mastering Preview</h1>

<input type="file" id="audioFile" accept="audio/*">

<div class="controls">
  <label>Gain</label>
  <input type="range" id="gain" min="0.5" max="2" step="0.01" value="1">

  <label>Low EQ</label>
  <input type="range" id="low" min="-15" max="15" step="1" value="0">

  <label>Mid EQ</label>
  <input type="range" id="mid" min="-15" max="15" step="1" value="0">

  <label>High EQ</label>
  <input type="range" id="high" min="-15" max="15" step="1" value="0">
</div>

<button id="play">▶ Play Mastered</button>
<button id="stop">⏹ Stop</button>

<script src="mastering.js"></script>
</body>
</html>
